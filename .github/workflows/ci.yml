name: Quality_Checks

on:

  push:
    branches: [main,dev]
  pull_request:
    branches: [main,dev]

jobs:
  quality_checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:

      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Check Formatting
        run: uv run ruff format --check .
  
  test_casee:
    name: Test Cases
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
        
      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync
      
      - name: Run Tests
        run: uv run pytest
        
